name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish the current main without an empty commit.
  workflow_dispatch:

# Read-only by default; the deploy job asks for the extra scopes it needs.
permissions:
  contents: read

# One deployment at a time. Queued runs wait instead of cancelling, so the
# last push to main always ends up being what is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reports the Pages URL and the sub-path the site is served from,
      # which Astro needs at build time to emit correct asset links.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the artifact
      id-token: write # OIDC token the Pages deployment is verified with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
